<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Audio to Base64</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }
        h1 { color: #fff; }
        .upload-area {
            border: 2px dashed #666;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            border-radius: 10px;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin: 20px 0;
            padding: 10px;
            font-family: monospace;
            background: #2a2a3e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
        }
        .info {
            background: #2a2a3e;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🎵 Audio to Base64 Converter</h1>
    <p>Convert your MP3 audio files to base64 so they work without a web server!</p>
    
    <div class="info">
        <strong>Instructions:</strong>
        <ol>
            <li>Select an MP3 file below</li>
            <li>Click "Convert"</li>
            <li>Copy the base64 data</li>
            <li>Paste it into <code>js/utils/audioData.js</code></li>
        </ol>
    </div>

    <div class="upload-area">
        <input type="file" id="audioFile" accept="audio/mpeg,audio/mp3" />
        <br>
        <button onclick="convertFile()">Convert to Base64</button>
    </div>

    <div id="result"></div>

    <script>
        async function convertFile() {
            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first!');
                return;
            }

            if (!file.type.includes('audio')) {
                alert('Please select an audio file (MP3)!');
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const base64 = e.target.result;
                const fileName = file.name.replace('.mp3', '');
                
                // Map file names to audio keys
                const keyMap = {
                    'rotate': 'rotate',
                    'line-clear': 'lineClear',
                    'tetris': 'tetris',
                    'game-over': 'gameOver'
                };
                
                const key = keyMap[fileName] || fileName;
                
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `
                    <h3>✅ Conversion Complete!</h3>
                    <p><strong>File:</strong> ${file.name}</p>
                    <p><strong>Size:</strong> ${(file.size / 1024).toFixed(2)} KB</p>
                    <p><strong>Key:</strong> ${key}</p>
                    <p><strong>Copy this code:</strong></p>
                    <textarea readonly>${key}: '${base64}',</textarea>
                    <p><strong>Or copy just the base64 data:</strong></p>
                    <textarea readonly>${base64}</textarea>
                    <p><em>Paste this into <code>js/utils/audioData.js</code> in the AUDIO_DATA object</em></p>
                `;
            };
            
            reader.onerror = function() {
                alert('Error reading file!');
            };
            
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
